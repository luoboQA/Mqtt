# Configuration used by tests/integration/test_persistence.py only: a broker
# of its own (the test passes its own port on the command line) that snapshots
# its state every second, so a restart can be checked without waiting

log_level WARNING
log_path /tmp/sol_persistence_test.log

persistence_file /tmp/sol_persistence_test.db
persistence_interval 1s

# Keep the default (60s) so idle test connections are never dropped
keepalive 60s

# Re-send an unacknowledged QoS 1/2 message after two seconds
retransmit_interval 2s
