# Configuration used by tests/integration/test_tls.py only: a broker of its
# own (the test passes its own port on the command line) listening on TLS and
# requiring a client certificate signed by the authority in certs/.
#
# The paths are relative to the repository root, which is where CTest and the
# documented `python3 tests/integration/run.py` start from

log_level WARNING
log_path /tmp/sol_mtls_test.log

cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key
tls_protocols tlsv1_2,tlsv1_3

# Mutual TLS: no certificate, or one not signed by cafile, is refused during
# the handshake
require_client_cert true

keepalive 60s
retransmit_interval 2s
