# Configuration used by tests/integration/test_persistence.py only, for the
# write-ahead log case: the periodic snapshot is effectively disabled, so the
# broker is killed before it ever writes one and everything the next start
# knows can only come from the log

log_level WARNING
log_path /tmp/sol_persistence_test.log

persistence_file /tmp/sol_persistence_test.db
persistence_interval 3600s

# Keep the default (60s) so idle test connections are never dropped
keepalive 60s

# Long enough that an unacknowledged message stays in flight while the test
# snapshots it; a restored entry is due immediately whatever this value is
retransmit_interval 30s
