# Configuration used by the integration tests only, run from the repository
# root as `python3 tests/integration/run.py`. The intervals are kept short so
# the tests can observe stats publishes and retransmissions quickly

log_level WARNING
log_path /tmp/sol_test.log

# Publish the $SOL broker statistics every second
stats_publish_interval 1s

# Re-send an unacknowledged QoS 1/2 message (or PUBREL) after two seconds
retransmit_interval 2s

# Keep the default (60s) so idle test connections are never dropped
keepalive 60s
