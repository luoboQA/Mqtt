# Configuration used by tests/integration/test_tls.py only: a broker of its
# own (the test passes its own port on the command line) listening on TLS.
#
# cafile is what turns TLS on: certfile and keyfile are the certificate of the
# server and its private key, both signed by the authority in certs/

log_level WARNING
log_path /tmp/sol_tls_test.log

cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key
tls_protocols tlsv1_2,tlsv1_3

keepalive 60s
retransmit_interval 2s
