# Sol configuration file, uncomment and edit desired configuration

# Network configuration

# Uncomment ip_address and ip_port to set socket family to TCP, if unix_socket
# is set, UNIX family socket will be used

ip_address 127.0.0.1
ip_port 8883

# unix_socket /tmp/sol.sock

# Logging configuration

# Could be either DEBUG, INFO/INFORMATION, WARNING, ERROR
log_level DEBUG

log_path /tmp/sol.log

# Max memory the broker may hold. Over this limit it acts in three steps,
# each one logged: it reclaims the topics nothing refers to anymore (no
# subscriber, no retained message), then drops the oldest messages queued for
# the clients that are away, and when even that is not enough it refuses new
# connections until the memory comes back down
max_memory 2GB

# Seconds between two reclamations of the unused topics while the broker is
# under its memory limit (over the limit it reclaims on every check instead)
# reclaim_interval 60s

# Max memory that will be allocated for each request. Note that every client
# pre-allocates one read buffer and one write buffer of this size when it is
# accepted, so the per-connection cost is twice this value: 2MB here means
# ~4MB per client, while a 50MB setting would make every connection cost
# ~100MB (a handful of test clients is enough to fill a small machine)
max_request_size 2MB

# TCP backlog, size of the complete connection queue
tcp_backlog 128

# Interval of time between one stats publish on $SOL topics and the subsequent
stats_publish_interval 10s

# Seconds after which an unacknowledged QoS 1/2 message (or a PUBREL still
# waiting for its PUBCOMP) is re-transmitted with the DUP flag
# retransmit_interval 20s

# Upper bound of the Keep Alive the clients negotiate: a client asking for a
# longer period (or for none at all, Keep Alive 0) is disconnected after one
# and a half times this value with no packet arriving. 0 disables the cap and
# leaves the whole decision to the client
# keepalive 60s

# cafile certs/ca.crt
# certfile certs/alaptop.crt
# keyfile certs/alaptop.key

# allow_anonymous false
# password_file passwd_file

# Topic level authorization: one rule per line, evaluated in order,
#   <allow|deny> <read|write|readwrite> <principal> <topic filter>
# where the principal is 'client:<id>', 'user:<username>' or '*' for anybody
# and the filter uses the same wildcards a subscription does. A topic no rule
# covers is denied, so an empty file denies everything. Unset means every
# authenticated client may read and write every topic. Example:
#   allow readwrite client:sensor-1  sensors/#
#   allow read      user:alice       sensors/#
#   deny  readwrite *                #
# acl_file /etc/sol/sol.acl

# tls_protocols tlsv1,tlsv1_1,tlsv1_2,tlsv1_3
